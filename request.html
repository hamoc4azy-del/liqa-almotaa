<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب جديد | لقاء الموتى</title><link rel="stylesheet" href="css/main.css"></head><body><div class="notice">تجربة خيالية — استخدم بيانات تجريبية عند الاختبار.</div><header><a class="brand" href="index.html"><b>ل</b><span>لقاء الموتى<small>مركز الطلبات التذكاري</small></span></a></header><main class="narrow"><div class="steps">01 البيانات　—　02 المراجعة　—　03 إنشاء الطلب</div><div class="panel"><em>طلب لقاء جديد</em><h1>بيانات مقدم الطلب</h1><form id="f"><div class="grid"><label>الاسم الكامل<input required name="applicant"></label><label>البريد الإلكتروني<input type="email" name="email"></label></div><label>صلة القرابة<select name="relation"><option>قريب</option><option>صديق</option><option>أحد أفراد العائلة</option><option>أخرى</option></select></label><hr><em>بيانات الشخص المطلوب</em><div class="grid"><label>الاسم الكامل<input required name="person"></label><label>تاريخ الميلاد<input required type="date" name="birth"></label><label>تاريخ الوفاة<input required type="date" name="death"></label><label>مكان الوفاة <small>اختياري</small><input name="place"></label></div><label>نوع الطلب<select name="type"><option>وداع أخير</option><option>رسالة لم تُقل</option><option>ذكرى شخصية</option><option>لقاء رمزي</option></select></label><label>ما الذي ترغب في قوله؟<textarea required name="message" maxlength="600"></textarea><small><span id="c">0</span>/600</small></label><label class="check"><input required type="checkbox"> أوافق أن هذه تجربة خيالية وليست وسيلة تواصل حقيقية.</label><button class="btn primary full">متابعة إلى المراجعة ←</button></form></div></main><script src="js/request.js"></script></body></html>
