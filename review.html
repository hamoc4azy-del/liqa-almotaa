<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة الطلب | لقاء الموتى</title><link rel="stylesheet" href="css/main.css"></head><body><div class="notice">تجربة خيالية تذكارية.</div><header><a class="brand" href="index.html"><b>ل</b><span>لقاء الموتى<small>مركز الطلبات التذكاري</small></span></a></header><main class="narrow"><div class="steps">01 البيانات　—　<b>02 المراجعة</b>　—　03 إنشاء الطلب</div><div class="panel"><em>المراجعة النهائية</em><h1>تأكد من التفاصيل</h1><div id="review"></div><div class="actions"><a class="btn" href="request.html">تعديل</a><button id="send" class="btn primary">إنشاء رقم الطلب</button></div></div></main><script>const d=JSON.parse(localStorage.liqaDraft||'null'),r=document.getElementById('review');if(!d){r.innerHTML='<p>لا يوجد طلب. <a href="request.html">ابدأ من هنا</a>.</p>'}else{r.innerHTML=Object.entries(d).map(([k,v])=>`<div class="row"><small>${k}</small><strong>${v||'—'}</strong></div>`).join('')}document.getElementById('send').onclick=()=>{if(!d)return;const x={...d,id:'LM-'+Math.floor(100000+Math.random()*900000),created:new Date().toISOString(),status:'قيد المراجعة'};localStorage.liqaRequest=JSON.stringify(x);localStorage.removeItem('liqaDraft');location='success.html'};</script></body></html>
