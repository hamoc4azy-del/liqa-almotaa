<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الطلب | لقاء الموتى</title><link rel="stylesheet" href="css/main.css"></head><body><div class="notice">الحالات والبيانات في هذه النسخة تجريبية ومحلية.</div><header><a class="brand" href="index.html"><b>ل</b><span>لقاء الموتى<small>مركز الطلبات التذكاري</small></span></a><nav><a href="index.html">الرئيسية</a><a href="archive.html">الأرشيف</a></nav></header><main class="narrow"><em>REQUEST TRACKING</em><h1>متابعة الطلب</h1><div class="search"><input id="q" placeholder="LM-284731"><button id="go" class="btn primary">بحث</button></div><div id="out"></div></main><script>const d=JSON.parse(localStorage.liqaRequest||'null');if(d)q.value=d.id;go.onclick=()=>{if(!d||q.value!==d.id){out.innerHTML='<div class="error">لم يتم العثور على طلب بهذا الرقم على هذا الجهاز.</div>';return}out.innerHTML=`<div class="panel"><div class="top"><small>رقم الطلب</small><b>${d.id}</b><span class="status">● ${d.status}</span></div><h2>${d.person}</h2><p>نوع الطلب: ${d.type} • تاريخ الوفاة: ${d.death}</p><hr><div class="timeline"><div>✓ <b>تم استلام الطلب</b></div><div>✓ <b>تم إنشاء ملف الطلب</b></div><div>● <b>الطلب قيد المراجعة</b></div><div>○ تحديد حالة اللقاء</div></div></div>`};if(d)go.click();</script></body></html>
